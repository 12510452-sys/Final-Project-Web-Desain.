<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Olahraga | Healthy Lifestyle</title>
  <meta name="description" content="Panduan gaya hidup sehat: makanan bergizi, olahraga, tidur, air putih, dan kesehatan mental.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bs-body-font-family: "DM Sans", system-ui, sans-serif; --bs-body-color: #14281f; --bs-border-color: #d3e1d8; --bs-success: #2e8b57; --bs-success-rgb: 46,139,87; }
    html { scroll-behavior: smooth; }
    [id] { scroll-margin-top: 4.5rem; }
    h1, h2, h3, .navbar-brand, .big { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800; }
    .btn-success { --bs-btn-bg: #2e8b57; --bs-btn-border-color: #2e8b57; --bs-btn-hover-bg: #26744a; --bs-btn-hover-border-color: #26744a; }
    .hero { background: radial-gradient(500px 250px at 100% 0, #2f8fc433, transparent 70%), radial-gradient(500px 250px at 0 100%, #2e8b5733, transparent 70%), #fff; }
    .title span { background: linear-gradient(90deg, #2e8b57, #2f8fc4); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .plate { width: min(100%, 280px); aspect-ratio: 1; border-radius: 50%; border: 10px solid #fff; background: conic-gradient(#2e8b57 0 33.3%, #e07b2e 0 66.6%, #5a63c8 0 83.3%, #b8588f 0); }
    .lift { transition: transform .2s; }
    .lift:hover { transform: translateY(-4px); }
    .form-check-input:checked { background-color: var(--bs-success); border-color: var(--bs-success); }
    .form-check-input:checked + label { text-decoration: line-through; color: var(--bs-secondary-color); }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-md sticky-top bg-white bg-opacity-75 border-bottom" style="backdrop-filter:blur(10px)">
    <div class="container" style="max-width:1040px">
      <a class="navbar-brand" href="index.html">Healthy Lifestyle</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Buka menu"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse justify-content-end" id="menu">
        <ul class="nav nav-pills fw-semibold pt-2 pt-md-0" style="--bs-nav-pills-link-active-bg:#14281f">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="makanan-sehat.html">Makanan Sehat</a></li>
          <li class="nav-item"><a class="nav-link active" href="olahraga.html">Olahraga</a></li>
          <li class="nav-item"><a class="nav-link" href="../orang-b/tips-tidur.html">Tips Tidur</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container py-4 py-md-5" style="max-width:1040px">
    <section data-page="or1">
      <div id="hero-or"></div>
      <div class="row g-3 mt-1" id="statsOr"></div>

      <h2 class="mt-5 pt-3">Jenis olahraga ringan untuk pemula</h2>
      <p class="text-secondary">Pilih yang paling kamu sukai agar mudah konsisten.</p>
      <div class="row g-3" id="jenisOr"></div>

      <h2 class="mt-5 pt-3">Manfaat berolahraga secara rutin</h2>
      <div class="row g-3" id="manfaatOr"></div>
      <div class="text-center mt-5">
        <a href="batasi-makanan.html" class="btn btn-outline-secondary rounded-pill px-4">Kembali ke Batasi Makanan</a>
        <a href="../orang-b/intensitas-jadwal.html" class="btn btn-success rounded-pill px-4">Lanjut ke Intensitas &amp; Jadwal</a>
      </div>
    </section>
  </main>

  <footer class="border-top py-4 mt-4 text-secondary small">
    <div class="container d-flex flex-wrap justify-content-between gap-2" style="max-width:1040px">
      <span>© <span id="year"></span> Healthy Lifestyle</span><span>Jaga tubuh, jaga pikiran</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const statsOr = [["150 mnt", "Aktivitas sedang per minggu"], ["3–5x", "Frekuensi olahraga per minggu"], ["5–10 mnt", "Pemanasan sebelum mulai"], ["2x", "Latihan penguat otot per minggu"]];
    const jenisOr = [
      ["images/jalankaki.jpg", "Cocok untuk semua usia", "Jalan kaki", "Mulai dari 15 menit sehari dengan langkah cepat, lalu tambah durasinya."],
      ["images/lariringan.jpg", "Melatih jantung", "Jogging atau lari ringan", "Perkuat daya tahan jantung dan paru-paru. Awali dengan selang-seling jalan dan lari."],
      ["images/bersepeda.jpg", "Ringan bagi sendi", "Bersepeda", "Bersepeda membantu meningkatkan kebugaran dan melatih otot kaki."],
      ["images/berenang.jpg", "Melatih seluruh tubuh", "Berenang", "Berenang melatih banyak kelompok otot sekaligus dan membantu menjaga kebugaran."],
      ["images/yoga.jpg", "Meningkatkan fleksibilitas", "Yoga", "Yoga membantu melatih kelenturan, keseimbangan, dan relaksasi."],
      ["images/menari.jpg", "Menyenangkan", "Menari", "Menari menjadi cara menyenangkan untuk bergerak dan meningkatkan kebugaran."]
    ];
    const manfaatOr = [
      ["Jantung lebih sehat", "Membantu menjaga tekanan darah dan kolesterol."],
      ["Otot dan tulang kuat", "Mengurangi risiko tulang rapuh dan cedera."],
      ["Berat badan terkontrol", "Membantu membakar kalori dan menjaga berat badan ideal."],
      ["Stres berkurang", "Gerak tubuh memicu hormon yang membuat suasana hati lebih baik."],
      ["Tidur lebih nyenyak", "Aktif di siang hari membantu tubuh lebih mudah beristirahat malam hari."],
      ["Lebih berenergi", "Stamina meningkat sehingga tidak mudah lelah saat beraktivitas."],
      ["Risiko penyakit menurun", "Membantu mencegah diabetes tipe 2 dan penyakit tidak menular lainnya."],
      ["Fokus lebih baik", "Aliran darah ke otak lancar sehingga konsentrasi meningkat."]
    ];

    const $ = id => document.getElementById(id);
    const put = (id, html) => $(id).innerHTML = html;
    const fill = (id, arr, fn) => put(id, arr.map(fn).join(""));
    const li = t => `<li class="list-group-item">${t}</li>`;
    const col = (cls, body) => `<div class="${cls}">${body}</div>`;
    const card = (body, style = "") => `<div class="card h-100 lift" style="${style}">${body}</div>`;
    const stat = cls => ([big, t]) => col(cls, card(`<div class="card-body"><div class="big fs-3 text-success mb-1">${big}</div><div class="small text-secondary">${t}</div></div>`));
    const info = ([t, d]) => col("col-12 col-sm-6 col-lg-3", card(`<div class="card-body"><h3 class="h6 fw-bold">${t}</h3><p class="text-secondary mb-0">${d}</p></div>`));
    const rows = ([a, b, c]) => `<tr><td><strong>${a}</strong></td><td>${b}</td><td>${c}</td></tr>`;
    const accordion = (id, key) => ([t, badge, items], i) => `
      <div class="accordion-item">
        <h3 class="accordion-header"><button class="accordion-button ${i ? "collapsed" : ""}" data-bs-toggle="collapse" data-bs-target="#${key}${i}">${t}<span class="badge rounded-pill text-bg-success ms-2">${badge}</span></button></h3>
        <div id="${key}${i}" class="accordion-collapse collapse ${i ? "" : "show"}" data-bs-parent="#${id}"><div class="accordion-body"><ul class="mb-0">${items.map(x => `<li>${x}</li>`).join("")}</ul></div></div>
      </div>`;
    const hero = (id, eyebrow, title, lead, sub, img, alt, extra = "", size = "display-5") => put(id, `
      <div class="card hero border rounded-4 shadow p-4 p-md-5"><div class="row align-items-center g-4">
        <div class="col-lg-7">
          <span class="badge rounded-pill bg-success-subtle text-success text-uppercase">${eyebrow}</span>
          <h1 class="title ${size} mt-3 mb-3">${title}</h1>
          <p class="fs-5">${lead}</p><p class="text-secondary mb-0">${sub}</p>${extra}
        </div>
        <div class="col-lg-5"><img src="${img}" alt="${alt}" class="w-100 rounded-4 object-fit-cover bg-success-subtle" style="aspect-ratio:4/3" onerror="this.onerror=null;this.style.visibility='hidden'"></div>
      </div></div>`);

    hero("hero-or", "Olahraga", "Rutin bergerak, <span>tubuh makin bugar</span>",
      "<strong class='text-success'>Olahraga</strong> adalah aktivitas fisik yang terencana dan dilakukan berulang untuk menjaga atau meningkatkan kebugaran tubuh.",
      "Tidak harus berat dan mahal. Jalan kaki, bersepeda, atau senam ringan di rumah sudah sangat bermanfaat bila dilakukan secara teratur.",
      "images/jogging.jpg", "Orang berolahraga di luar ruangan");

    fill("statsOr", statsOr, stat("col-6 col-md-3"));
    fill("jenisOr", jenisOr, ([e, b, t, d]) => {
      const visual = e.startsWith("images/")
        ? `<img src="${e}" alt="${t}" class="w-100 object-fit-cover" style="height:180px">`
        : `<div class="fs-1 text-center p-3 bg-success-subtle" aria-hidden="true">${e}</div>`;
      return col("col-12 col-sm-6 col-lg-4", `
        <div class="card h-100 overflow-hidden lift">
          ${visual}
          <div class="card-body">
            <span class="badge rounded-pill text-bg-success mb-2">${b}</span>
            <h3 class="h5 fw-bold">${t}</h3>
            <p class="text-secondary mb-0">${d}</p>
          </div>
        </div>`);
    });
    fill("manfaatOr", manfaatOr, info);

    $("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
